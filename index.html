<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Parada</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Parada">
<meta name="theme-color" content="#f4f1ea">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
/* VOICE: calma y precisión, como el poste de una parada que nunca miente
   IDEA: Madrid real a pantalla completa; lo que importa (tu próximo bus) flota encima
   PICTURE: mapa vectorial suave y fluido, tu punto azul, tus paradas con estrella
   COLOUR and TYPE: azul EMT como único acento sobre un mapa claro; Barlow
   LAYOUT: buscador arriba, tarjeta flotante abajo, barra con el orbe de voz en el centro */
:root{color-scheme:light dark;--acc:#1554d1;--red:#e0393e;--acc2:color-mix(in srgb,var(--acc) 72%,var(--red));--warm:color-mix(in srgb,var(--acc) 9%,color-mix(in srgb,var(--red) 7%,var(--ui)));--ui:light-dark(#ffffff,#161c24);--ui2:light-dark(#f1f3f6,#212a35);--ink:light-dark(#111821,#eef2f6);--mute:light-dark(#5a6573,#9aa6b4);--hair:light-dark(#e3e7ec,#2c3540);--bg:light-dark(#f6f1f0,#110e12);--sh:0 8px 30px light-dark(rgba(20,30,45,.16),rgba(0,0,0,.55));--ease:cubic-bezier(.2,.85,.25,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#map{position:fixed;inset:0}
body.night .maplibregl-canvas{filter:invert(.92) hue-rotate(180deg) saturate(.7) brightness(.95)}
.maplibregl-ctrl-attrib{font-size:10px;opacity:.7}
.maplibregl-ctrl-bottom-right{bottom:calc(84px + env(safe-area-inset-bottom))}
/* marcadores */
.me{width:20px;height:20px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 0 rgba(26,115,232,.5),0 2px 6px rgba(0,0,0,.3);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(26,115,232,0),0 2px 6px rgba(0,0,0,.3)}100%{box-shadow:0 0 0 0 rgba(26,115,232,0),0 2px 6px rgba(0,0,0,.3)}}
.fav{width:30px;height:30px;border-radius:50%;background:var(--ui);border:2.5px solid var(--acc);display:grid;place-items:center;color:var(--acc);box-shadow:0 3px 10px rgba(0,0,0,.2);cursor:pointer}
.fav svg{width:15px;height:15px;fill:currentColor;stroke:none}
.bus{height:22px;min-width:22px;padding:0 6px;border-radius:11px;background:var(--acc);color:#fff;font:700 13px/22px 'Barlow Condensed',sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
/* arriba */
#top{position:fixed;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;z-index:5;pointer-events:none}
.search{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ui);border-radius:24px;height:48px;padding:0 14px;box-shadow:var(--sh);width:100%;text-align:left;color:var(--mute);font-size:16px}
.dot{width:8px;height:8px;border-radius:50%;background:#e89a00;margin-left:auto;flex:none;transition:background .3s}
.dot.ok{background:#1fb26b}.dot.err{background:#e2362b}
#locate.away{opacity:0;pointer-events:none;transform:scale(.6)}
#locate{position:fixed;transition:bottom .35s var(--ease),opacity .25s,transform .25s;right:12px;z-index:5;width:46px;height:46px;border-radius:50%;background:var(--ui);box-shadow:var(--sh);display:grid;place-items:center;bottom:calc(var(--cardH,200px) + 112px + env(safe-area-inset-bottom));transition:bottom .35s var(--ease),color .2s}
#locate.on{color:#1a73e8}
/* tarjeta */
#card{position:fixed;left:10px;right:10px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:6;background:var(--ui);border-radius:24px;box-shadow:var(--sh);max-height:min(42vh,calc(100vh - 300px));max-height:min(42dvh,calc(100dvh - 300px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));display:flex;flex-direction:column;transition:max-height .4s var(--ease),transform .4s var(--ease);will-change:transform}
#card.big{max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
#card.hide{transform:translateY(calc(100% + 110px))}
.grab{height:30px;display:grid;place-items:center;flex:none;touch-action:none}
.grab::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--hair)}
#body{overflow-y:auto;padding:0 16px 16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.enter{animation:up .32s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
h2{font-size:21px;line-height:1.15;margin:0 0 2px;font-weight:700;text-wrap:balance}
.sub{color:var(--mute);font-size:14px;margin:0 0 8px}
.lbl{color:var(--mute);font-size:13px;font-weight:600;margin:14px 0 6px}
.hd{display:flex;align-items:flex-start;gap:10px}.grow{flex:1}
.rb{width:44px;height:44px;border-radius:50%;background:var(--ui2);display:grid;place-items:center;flex:none;transition:transform .15s}
.rb:active,.hero:active,.row:active,.btn:active,.orbBtn:active{transform:scale(.96)}
.hero{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--warm);text-align:left;transition:transform .15s}
.hb{display:grid;place-items:center;min-width:46px;height:46px;padding:0 6px;border-radius:13px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font:700 21px 'Barlow Condensed',sans-serif;flex:none}
.hero b{display:block;font-size:17px}.hero .t{display:block;color:var(--mute);font-size:14px}
.bigN{font:700 36px/1 'Barlow Condensed',sans-serif;white-space:nowrap}.bigN small{font:600 13px Barlow,sans-serif;color:var(--mute);margin-left:2px}
.leave{margin:8px 4px 0;font-weight:600;color:color-mix(in srgb,var(--acc2) 80%,#000 0%);font-size:15px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair);width:100%;text-align:left;transition:transform .15s}
.row:last-child{border-bottom:0}
.badge{display:inline-grid;place-items:center;min-width:32px;height:24px;padding:0 6px;border-radius:7px;background:var(--acc);color:#fff;font:700 15px 'Barlow Condensed',sans-serif;flex:none}
.min{font:700 24px/1 'Barlow Condensed',sans-serif;white-space:nowrap;text-align:right}.min small{font:600 12px Barlow,sans-serif;color:var(--mute);margin-left:2px}
.min.now{color:#1fb26b}
.nx{font-size:13px;color:var(--mute);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 14px;border-radius:18px;background:var(--ui2);display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;white-space:nowrap;transition:background .2s,color .2s}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.btn{width:100%;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;transition:transform .15s}
.btn.soft{background:var(--ui2);color:var(--ink)}
.inp{width:100%;height:46px;border-radius:14px;border:2px solid var(--hair);background:var(--ui2);color:var(--ink);font:500 16px Barlow,sans-serif;padding:0 14px}
.fresh{font-size:12px;color:var(--mute);margin-top:10px}
.warn{background:light-dark(#fff4e5,#2a2114);color:light-dark(#8a4b00,#f3c27a);border-radius:14px;padding:12px 14px;font-size:14px;margin:6px 0}
.skel{height:62px;border-radius:16px;background:linear-gradient(90deg,var(--ui2),var(--hair),var(--ui2));background-size:200% 100%;animation:sk 1.2s linear infinite;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.mi{width:36px;height:36px;border-radius:11px;background:var(--ui2);display:grid;place-items:center;flex:none}
.top .mi{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.tag{font-size:12px;font-weight:700;color:var(--acc2);background:color-mix(in srgb,var(--acc2) 14%,transparent);padding:2px 7px;border-radius:8px;vertical-align:2px}
/* barra */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:8;height:calc(78px + env(safe-area-inset-bottom));padding:0 30px env(safe-area-inset-bottom);background:var(--ui);display:flex;align-items:center;justify-content:space-between;box-shadow:0 -4px 20px light-dark(rgba(20,30,45,.08),rgba(0,0,0,.4))}
.nv{display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--mute);width:70px;transition:color .2s}
.nv.on{color:var(--acc2)}
.orbBtn{display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--acc);transform:translateY(-20px);transition:transform .15s}
.orb{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),transparent 42%),conic-gradient(from 210deg,var(--acc),#7c5cff,#e2362b,#f0a202,var(--acc));box-shadow:0 10px 26px color-mix(in srgb,var(--acc) 45%,transparent),0 0 0 6px var(--ui);animation:breath 3.2s ease-in-out infinite}
.orb svg.i{width:28px;height:28px;stroke-width:2.2}
@keyframes breath{50%{transform:scale(1.04)}}
/* páginas */
.page{position:fixed;inset:0;z-index:12;background:var(--bg);transform:translateX(100%);transition:transform .38s var(--ease);overflow-y:auto;padding:0 14px calc(30px + env(safe-area-inset-bottom));will-change:transform}
.page.open{transform:none}
.pgHead{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 0 10px;background:var(--bg);z-index:1}
.pgHead b{font-size:24px}
.grp{background:var(--ui);border-radius:18px;padding:4px 14px 12px;margin:10px 0}
.tg{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--hair);width:100%;font-weight:500;text-align:left}
.tg:last-child{border-bottom:0}
.tg i{width:48px;height:28px;border-radius:14px;background:var(--hair);position:relative;transition:background .25s;flex:none}
.tg i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg.on i{background:linear-gradient(135deg,var(--acc),var(--acc2))}.tg.on i::after{transform:translateX(20px)}
.sw{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid var(--ui);box-shadow:0 0 0 2px var(--hair);transition:box-shadow .2s}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
/* voz */
#voice{position:fixed;inset:0;z-index:20;background:light-dark(rgba(244,241,234,.96),rgba(10,14,20,.96));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px 24px calc(30px + env(safe-area-inset-bottom));opacity:0;pointer-events:none;transition:opacity .3s}
#voice.open{opacity:1;pointer-events:auto}
#vOrb{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 40%),conic-gradient(from 210deg,var(--acc),#7c5cff,#e2362b,#f0a202,var(--acc));box-shadow:0 20px 60px color-mix(in srgb,var(--acc) 50%,transparent);transition:transform .2s;animation:spin 9s linear infinite}
#vOrb.listen{animation:spin 3s linear infinite,throb 1.1s ease-in-out infinite}
@keyframes spin{to{rotate:1turn}}@keyframes throb{50%{transform:scale(1.08)}}
#vText{font-size:24px;font-weight:600;text-align:center;min-height:2.6em;max-width:520px;text-wrap:balance}
#vSub{color:var(--mute);text-align:center;font-size:15px;max-width:440px}
#vBtns{display:grid;gap:10px;width:100%;max-width:420px}
#vClose{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px}
/* rutas y avisos */
.steps{margin:6px 0 4px;position:relative}
.st{display:flex;gap:12px;align-items:flex-start;padding:8px 0;position:relative}
.st .mi{width:34px;height:34px;border-radius:50%}
.st:not(:last-child)::after{content:"";position:absolute;left:16px;top:44px;bottom:-6px;width:2px;background:var(--hair)}
#alert{position:fixed;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));z-index:15;min-height:48px;background:var(--ink);color:var(--ui);border-radius:18px;padding:14px 16px;display:flex;gap:10px;align-items:center;font-weight:600;box-shadow:var(--sh);transform:translateY(-160%);transition:transform .45s var(--ease),visibility 0s .45s}
#alert{pointer-events:none;visibility:hidden}#alert.show{transform:none;pointer-events:auto;visibility:visible;transition:transform .45s var(--ease),visibility 0s}#alert.urg{background:#e2362b;color:#fff}
/* modo viaje */
#top{transition:transform .45s var(--ease)}
#card{transition:max-height .4s var(--ease),transform .45s var(--ease),opacity .3s}
body.trip #top{transform:translateY(-150%)}
body.trip #card{transform:translateY(25%) scale(.55);opacity:0;pointer-events:none}
body.trip #nav{transform:translateY(calc(100% + 50px))}
body.trip #restore{transform:translate(-50%,140px)}
body.trip #locate{bottom:calc(150px + env(safe-area-inset-bottom))!important;opacity:1;pointer-events:auto;transform:none}
body.trip.mini #locate{bottom:calc(24px + env(safe-area-inset-bottom))!important;right:auto;left:12px}
#trip{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;background:linear-gradient(135deg,#171a22,#241a22);color:#fff;border-radius:30px;padding:12px 10px 14px 12px;box-shadow:0 18px 44px rgba(0,0,0,.38);transform:translateY(170%);transition:transform .6s cubic-bezier(.34,1.45,.64,1),width .5s var(--ease),left .5s var(--ease),border-radius .5s var(--ease),padding .5s var(--ease)}
body.trip #trip{transform:none}
#trip .row1{display:flex;align-items:center;gap:12px}
#tripMain{flex:1;display:flex;align-items:center;gap:12px;text-align:left;color:inherit;min-height:62px}
.ring{width:62px;height:62px;position:relative;flex:none}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:rgba(255,255,255,.14)}.ring .fg{stroke:url(#tripGrad);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 22px/1 'Barlow Condensed',sans-serif}
.ring b small{display:block;font:600 10px Barlow,sans-serif;opacity:.7;margin-top:-6px}
#tripTx{display:grid;gap:2px}
#tripTx b{font-size:17px;line-height:1.2}
#tripTx span{font-size:13px;opacity:.75}
.tbtns{display:grid;gap:4px}
.tbtns button{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff}
.track{display:flex;gap:3px;height:6px;margin:12px 6px 0;position:relative}
.track span{border-radius:3px;min-width:6px}
.track i{position:absolute;top:-5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.22);transition:left 1s linear}
body.trip.mini #trip{left:calc(100% - 98px);border-radius:43px;padding:12px}
body.trip.mini #tripTx,body.trip.mini .track,body.trip.mini .tbtns{display:none}
@media(min-width:900px){#trip{left:16px;right:auto;width:420px}body.trip.mini #trip{left:16px;width:86px}}
/* solo mapa */
#nav{transition:transform .4s var(--ease)}
body.solo #card{transform:translateY(calc(100% + 130px))}
body.solo #nav{transform:translateY(calc(100% + 50px))}
body.solo #locate{bottom:calc(84px + env(safe-area-inset-bottom))}
#restore{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:7;transform:translate(-50%,140px);transition:transform .4s var(--ease);height:48px;padding:0 18px;border-radius:24px;background:var(--ui);box-shadow:var(--sh);display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
body.solo #restore{transform:translate(-50%,0)}
#restore .hb2{min-width:30px;height:26px;padding:0 6px;border-radius:8px;background:var(--acc);color:#fff;font:700 15px/26px 'Barlow Condensed',sans-serif;text-align:center}
.soloBtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;color:var(--mute);font-size:15px;font-weight:600;height:44px}
@media(min-width:900px){#card{left:16px;right:auto;width:400px;bottom:96px}.page{left:auto;width:440px;box-shadow:-10px 0 40px rgba(0,0,0,.2)}#locate{bottom:110px!important}}
body.bigtext #card,body.bigtext .page,body.bigtext #trip{zoom:1.15}
body.calm *{animation:none!important;transition-duration:.01s!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>
<header id="top"><button class="search" id="q"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>¿A dónde vas?<span class="dot" id="dot" role="img" aria-label="Conectando con la EMT"></span></button></header>
<button id="locate" aria-label="Mi ubicación"><svg class="i" viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg></button>
<section id="card" aria-label="Panel de información"><button class="grab" id="grab" aria-label="Ampliar o reducir el panel" style="width:100%"></button><div id="body"></div></section>
<section id="trip" aria-label="Viaje en curso" inert>
 <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="tripGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7aa2ff"/><stop offset="1" stop-color="#ff6b6b"/></linearGradient></defs></svg>
 <div class="row1"><button id="tripMain" aria-label="Ver los pasos del viaje"><span class="ring"><svg viewBox="0 0 62 62" aria-hidden="true"><circle class="bgc" cx="31" cy="31" r="27"/><circle class="fg" id="tripArc" cx="31" cy="31" r="27" stroke-dasharray="169.6" stroke-dashoffset="0"/></svg><b id="tripMin"></b></span><span id="tripTx"><b></b><span></span></span></button>
 <div class="tbtns"><button id="tripSmall" aria-label="Hacer más pequeño"><svg class="i" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg></button><button id="tripEnd" aria-label="Terminar viaje"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
 <div class="track" id="tripTrack" aria-hidden="true"></div>
</section>
<div id="alert" role="alert" aria-live="assertive" title="Toca para cerrar"></div>
<button id="restore" aria-label="Mostrar panel"><svg class="i" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg><span id="rtxt">Mostrar</span></button>
<nav id="nav" aria-label="Navegación principal">
 <button class="nv on" id="tMap"><svg class="i" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>
 <button class="orbBtn" id="tVoice" aria-label="Hablar"><span class="orb"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>Hablar</button>
 <button class="nv" id="tSet"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
</nav>
<section class="page" id="set" role="dialog" aria-modal="true" aria-label="Ajustes" inert><div class="pgHead"><button class="rb" id="setBack" aria-label="Volver"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><b>Ajustes</b></div><div id="setBody"></div></section>
<section id="voice" role="dialog" aria-modal="true" aria-label="Hablar" inert>
 <button class="rb" id="vClose" aria-label="Cerrar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
 <div id="vOrb"></div><div id="vText" aria-live="polite">Toca y habla</div><div id="vSub">Prueba: «¿Cuándo pasa mi bus?» o «Llévame a Moncloa».</div>
 <div id="vBtns"><button class="btn" id="vTalk"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Hablar</button><a class="btn soft" id="vClaude" href="https://claude.ai/new" target="_blank" rel="noopener" style="text-decoration:none">Seguir con Claude</a></div>
</section>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const cap=s=>String(s||'').toLowerCase().replace(/(^|[\s(/-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/\b(De|Del|La|Las|Los|Y|El)\b/g,w=>w.toLowerCase());
const clock=(m=0)=>new Date(Date.now()+m*60000).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const IC={x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',star:'<svg class="i" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',starF:'<svg class="i" viewBox="0 0 24 24" style="fill:currentColor"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',pin:'<svg class="i" viewBox="0 0 24 24"><path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',bus:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="15" rx="3"/><path d="M5 11h14M8 21v-3M16 21v-3"/></svg>',walk:'<svg class="i" viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="m9 21 2-6 3 3v3M8 11l3-3 3 1 2 3M11 8l-1 7"/></svg>',bike:'<svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l4-8h5l3 8M10 8 8 5H6M12 16l3-8"/></svg>',moto:'<svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l-2-6H9M15 6h3l2 8M13 11h5"/></svg>',car:'<svg class="i" viewBox="0 0 24 24"><path d="M4 16V12l2-5h12l2 5v4z"/><circle cx="7.5" cy="16.5" r="1.8"/><circle cx="16.5" cy="16.5" r="1.8"/><path d="M5 12h14"/></svg>',taxi:'<svg class="i" viewBox="0 0 24 24"><path d="M4 17v-5l2-5h12l2 5v5z"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/><path d="M10 4h4v3h-4z"/></svg>',phone:'<svg class="i" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>',train:'<svg class="i" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="14" rx="3"/><path d="M6 11h12M9 21l1.5-4M15 21l-1.5-4"/></svg>'};

/* ---------- preferencias ---------- */
const DEF={style:'claro',acc:'#1554d1',buses:false,speak:true,abono:false,sortBy:'eq',modes:{walk:true,bici:true,bus:true,moto:true,coche:true,taxi:true,vtc:true},favs:[{id:'2044',nombre:'Ministerio de Agricultura',alias:'Atocha',lat:40.40836,lon:-3.69035}]};
let P=JSON.parse(JSON.stringify(DEF));try{Object.assign(P,JSON.parse(localStorage.getItem('parada')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('parada',JSON.stringify(P))}catch(e){}};
const KEY=new URLSearchParams(location.search).get('key')||(()=>{try{return localStorage.getItem('parada-key')}catch(e){return ''}})()||'';
try{if(KEY)localStorage.setItem('parada-key',KEY)}catch(e){}

/* ---------- datos EMT (puente en Vercel) ---------- */
const API=/vercel\.app$/.test(location.host)?'':'https://tdmaps.vercel.app';
const dot=$('#dot');
const setDot=c=>{dot.className='dot '+c;dot.setAttribute('aria-label',c==='ok'?'EMT en directo':c==='err'?'Sin conexión con la EMT':'Conectando')};
async function api(tool,params){const q=new URLSearchParams({tool,...params,key:KEY});const r=await fetch(API+'/api/emt?'+q,{cache:'no-store'});const j=await r.json().catch(()=>({}));
 if(!r.ok){setDot('err');throw new Error(r.status===401?'Falta la clave: abre la app con el enlace que lleva ?key=':j.error||'La EMT no responde')}setDot('ok');return j}
const ARR=new Map();// id -> {data,at,err}
async function fetchArr(id){id=String(id);try{const d=await api('llegadas',{parada:id});ARR.set(id,{data:d,at:Date.now()})}catch(e){const o=ARR.get(id)||{};ARR.set(id,{...o,err:e.message})}}
function group(d){const by=new Map();for(const a of(d&&d.llegadas)||[]){const k=String(a.linea);if(!by.has(k))by.set(k,{linea:k,destino:cap(a.destino),m:[]});if(a.minutos!=null)by.get(k).m.push(a.minutos)}return[...by.values()].map(g=>({...g,m:g.m.sort((a,b)=>a-b)})).sort((a,b)=>(a.m[0]??999)-(b.m[0]??999))}
const mins=m=>m==null?'—':m<=0?'Ya':m;
let nearMe=[],cur=null,view='home';
const watched=()=>[...new Set([...P.favs.map(f=>String(f.id)),...nearMe,cur].filter(Boolean))];
async function refresh(){await Promise.all(watched().map(fetchArr));updateBuses();rerender()}
setInterval(()=>{if(!document.hidden)refresh()},25000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});

/* ---------- mapa ---------- */
const STY={claro:'https://tiles.openfreemap.org/styles/positron',detallado:'https://tiles.openfreemap.org/styles/liberty',vivo:'https://tiles.openfreemap.org/styles/bright',noche:'https://tiles.openfreemap.org/styles/positron'};
const map=new maplibregl.Map({container:'map',style:STY[P.style]||STY.claro,center:[-3.7035,40.4169],zoom:11.6,minZoom:8.6,maxZoom:19.5,maxBounds:[[-4.75,39.8],[-2.85,41.25]],dragRotate:false,pitchWithRotate:false,attributionControl:{compact:true},fadeDuration:150});
map.touchZoomRotate.disableRotation();map.keyboard.disableRotation();
const STOPS=new Map();
function stopsGeo(){const fav=new Set(P.favs.map(f=>String(f.id)));return{type:'FeatureCollection',features:[...STOPS.values()].filter(s=>!fav.has(s.id)).map(s=>({type:'Feature',properties:{id:s.id,n:s.nombre},geometry:{type:'Point',coordinates:[s.lon,s.lat]}}))}}
function addLayers(){if(map.getSource('stops'))return;
 map.addSource('stops',{type:'geojson',data:stopsGeo()});
 map.addLayer({id:'stops',type:'circle',source:'stops',minzoom:13.5,paint:{'circle-radius':['interpolate',['linear'],['zoom'],13.5,3,17,7],'circle-color':'#ffffff','circle-stroke-color':P.acc,'circle-stroke-width':['interpolate',['linear'],['zoom'],13.5,1.5,17,3]}});
 try{map.addLayer({id:'stops-lab',type:'symbol',source:'stops',minzoom:16,layout:{'text-field':['get','n'],'text-size':12,'text-offset':[0,1.2],'text-anchor':'top','text-font':['Noto Sans Regular']},paint:{'text-color':'#3a4450','text-halo-color':'#fff','text-halo-width':1.5}})}catch(e){}
 map.on('click','stops',e=>{const f=e.features&&e.features[0];if(f)openStop(f.properties.id)});
 map.on('mouseenter','stops',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','stops',()=>map.getCanvas().style.cursor='')}
map.on('style.load',addLayers);
const setStops=()=>{const s=map.getSource('stops');if(s)s.setData(stopsGeo())};
function addStops(list){for(const s of list||[]){if(!s.coordenadas)continue;const id=String(s.parada);STOPS.set(id,{id,nombre:cap(s.nombre),lat:s.coordenadas.lat,lon:s.coordenadas.lon,lineas:(s.lineas||[]).map(l=>({linea:String(l.linea),hacia:cap(l.hacia||l.a||'')})),dist:s.distancia_m})}setStops()}
/* paradas al mover el mapa, como en Google Maps */
const fetched=new Set();let mvT=null;
map.on('moveend',()=>{clearTimeout(mvT);mvT=setTimeout(async()=>{if(map.getZoom()<14.5)return;const c=map.getCenter(),k=c.lat.toFixed(3)+','+c.lng.toFixed(3);if(fetched.has(k))return;fetched.add(k);try{addStops(await api('paradas_cercanas',{lat:c.lat.toFixed(6),lon:c.lng.toFixed(6),radio_m:600}))}catch(e){}},450)});
/* favoritas */
let favMk=[];
function drawFavs(){favMk.forEach(m=>m.remove());favMk=P.favs.filter(f=>f.lat!=null).map(f=>{const d=document.createElement('button');d.className='fav';d.setAttribute('aria-label',f.alias||f.nombre);d.innerHTML='<svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';d.onclick=e=>{e.stopPropagation();openStop(f.id)};return new maplibregl.Marker({element:d}).setLngLat([f.lon,f.lat]).addTo(map)});setStops()}
/* buses con movimiento suave */
const BUS=new Map();
function updateBuses(){const seen=new Set();if(P.buses)for(const id of watched()){const d=ARR.get(id)&&ARR.get(id).data;for(const a of(d&&d.llegadas)||[]){if(!a.posicion||a.bus==null)continue;const k=String(a.bus);if(seen.has(k))continue;seen.add(k);let b=BUS.get(k);
  if(!b){const el=document.createElement('div');el.className='bus';el.textContent=a.linea;b={mk:new maplibregl.Marker({element:el}).setLngLat([a.posicion.lon,a.posicion.lat]).addTo(map),x:a.posicion.lon,y:a.posicion.lat};BUS.set(k,b)}b.tx=a.posicion.lon;b.ty=a.posicion.lat}}
 for(const[k,b]of BUS)if(!seen.has(k)){b.mk.remove();BUS.delete(k)}}
(function anim(){for(const b of BUS.values()){if(b.tx==null)continue;b.x+=(b.tx-b.x)*.04;b.y+=(b.ty-b.y)*.04;b.mk.setLngLat([b.x,b.y])}requestAnimationFrame(anim)})();

/* ---------- GPS ---------- */
let ME=null,meMk=null,follow=false;
function startGPS(){if(!('geolocation' in navigator))return;navigator.geolocation.watchPosition(p=>{const first=!ME;ME={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
  if(!meMk){const d=document.createElement('div');d.className='me';meMk=new maplibregl.Marker({element:d}).setLngLat([ME.lon,ME.lat]).addTo(map)}else meMk.setLngLat([ME.lon,ME.lat]);
  $('#locate').classList.add('on');if(first||follow){map.flyTo({center:[ME.lon,ME.lat],zoom:Math.max(map.getZoom(),15.3),speed:1.4});follow=false;nearby()}},
 e=>{$('#locate').classList.remove('on');if(e.code===1)toast('Permite la ubicación: Ajustes del iPhone → Privacidad → Localización → Safari.')},{enableHighAccuracy:true,maximumAge:10000,timeout:20000})}
let lastNear=null;
async function nearby(){if(!ME)return;if(lastNear&&hav(lastNear,ME)<.12)return;lastNear={...ME};try{const l=await api('paradas_cercanas',{lat:ME.lat.toFixed(6),lon:ME.lon.toFixed(6),radio_m:450});addStops(l);nearMe=(l||[]).slice(0,4).map(s=>String(s.parada));await Promise.all(nearMe.map(fetchArr));updateBuses();rerender()}catch(e){}}
$('#locate').onclick=()=>{if(ME){map.flyTo({center:[ME.lon,ME.lat],zoom:16,speed:1.4})}else{follow=true;startGPS()}};

/* ---------- interfaz ---------- */
const card=$('#card'),body=$('#body');
const setH=()=>{document.documentElement.style.setProperty('--cardH',card.offsetHeight+'px');const r=card.getBoundingClientRect();$('#locate').classList.toggle('away',r.top<190&&!document.body.classList.contains('solo'))};new ResizeObserver(setH).observe(card);
const solo=on=>{document.body.classList.toggle('solo',on);if(on){const h=nextBus();$('#rtxt').innerHTML=h?`<span class="hb2">${esc(h.g.linea)}</span> ${h.m<=0?'Ya':h.m+' min'}`:'Mostrar'}};
let gy=null;$('#grab').addEventListener('pointerdown',e=>{gy=e.clientY});addEventListener('pointerup',e=>{if(gy==null)return;const d=e.clientY-gy;gy=null;if(d<-25)card.classList.add('big');else if(d>25){if(card.classList.contains('big'))card.classList.remove('big');else solo(true)}else card.classList.toggle('big')});
$("#restore").onclick=()=>{solo(false);body.scrollTop=0};
let toastT;function toast(t){body.insertAdjacentHTML('afterbegin',`<div class="warn enter">${esc(t)}</div>`);clearTimeout(toastT);toastT=setTimeout(()=>{const w=body.querySelector('.warn');w&&w.remove()},7000)}
function render(html){body.innerHTML=html;body.firstElementChild&&body.firstElementChild.classList.add('enter');body.scrollTop=0}
const rerender=()=>{if(view==='route')return;if(view==='home')renderHome();else if(view==='stop'&&cur)paintStop();else if(view==='compare')paintCompare()};
const hav=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r,x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const walkMin=s=>ME&&s&&s.lat!=null?Math.max(1,Math.round(hav(ME,s)*1.3/4.8*60)):null;

function nextBus(){const cands=[];const scan=ids=>{for(const id of ids){const st=STOPS.get(id)||P.favs.find(f=>String(f.id)===id);const w=walkMin(st)||0;for(const g of group(ARR.get(id)&&ARR.get(id).data)){const m=g.m.find(x=>x>=w);if(m!=null)cands.push({id,st,g,m,w})}}};
 scan(nearMe);if(!cands.length)scan(P.favs.map(f=>String(f.id)));return cands.sort((a,b)=>a.m-b.m)[0]}
function renderHome(){view='home';cur=null;if(typeof clearRoute==='function'&&!WATCH)clearRoute();const h=nextBus();const loading=![...ARR.values()].some(a=>a.data);
 const name=x=>{const f=P.favs.find(f=>String(f.id)===x.id);return(f&&(f.alias||f.nombre))||(x.st&&x.st.nombre)||'Parada '+x.id};
 const near=nearMe.map(id=>({id,st:STOPS.get(id),g:group(ARR.get(id)&&ARR.get(id).data)}));
 render(`<div>${loading?'<p class="sub">Tu próximo bus</p><div class="skel"></div>':h?`<p class="sub">Tu próximo bus</p>
  <button class="hero" data-s="${esc(h.id)}"><span class="hb">${esc(h.g.linea)}</span><span class="grow"><b>${esc(name(h))}</b><span class="t">hacia ${esc(h.g.destino)}</span></span><span class="bigN">${h.m<=0?'Ya':h.m}${h.m>0?'<small>min</small>':''}</span></button>
  <p class="leave">${h.w?(h.m-h.w<=1?'Sal ya':'Sal en '+(h.m-h.w)+' min')+' · '+h.w+' min andando':(h.g.m[1]!=null?'Siguiente en '+h.g.m[1]+' min':'')}</p>`:'<p class="sub">Ahora mismo no hay buses con tiempo estimado.</p>'}
 ${near.length?`<p class="lbl">Cerca de ti</p>${near.map(x=>`<button class="row" data-s="${esc(x.id)}"><div class="grow"><b style="font-size:15px">${esc(x.st?x.st.nombre:'Parada '+x.id)}</b><div class="nx">${walkMin(x.st)?walkMin(x.st)+' min andando':''}</div></div><span style="display:flex;gap:6px;align-items:center">${x.g.slice(0,3).map(g=>`<span class="badge">${esc(g.linea)}</span><b>${mins(g.m[0])}${g.m[0]>0?"'":''}</b>`).join('')||'<span class="nx">sin buses</span>'}</span></button>`).join('')}`:ME?'':'<button class="row" id="gps">'+IC.pin+'<div class="grow"><b>Activar mi ubicación</b><div class="nx">Para ver las paradas que tienes al lado</div></div></button>'}
 ${''}${P.favs.length?`<p class="lbl">Mis paradas</p><div class="chips">${P.favs.map(f=>`<button class="chip" data-s="${esc(f.id)}">${IC.star}${esc(f.alias||f.nombre)}</button>`).join('')}</div>`:''}<button class="soloBtn" id="soloB"><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>Ver solo el mapa</button></div>`);
 body.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>openStop(b.dataset.s));if($('#gps'))$('#gps').onclick=()=>{follow=true;startGPS()};$('#soloB').onclick=()=>solo(true);setH()}

async function openStop(id){id=String(id);solo(false);view='stop';cur=id;card.classList.remove('big');
 let s=STOPS.get(id)||P.favs.find(f=>String(f.id)===id);if(s&&s.lat!=null)map.flyTo({center:[s.lon,s.lat],zoom:Math.max(map.getZoom(),16),speed:1.3,padding:{bottom:card.offsetHeight}});
 paintStop();await fetchArr(id);updateBuses();if(view==='stop'&&cur===id)paintStop();
 if(!s||s.lat==null){try{const i=await api('info_parada',{parada:id});const o={id,nombre:cap(i.nombre),lat:i.coordenadas&&i.coordenadas.lat,lon:i.coordenadas&&i.coordenadas.lon,lineas:[]};STOPS.set(id,o);setStops();if(o.lat!=null)map.flyTo({center:[o.lon,o.lat],zoom:16});if(view==='stop'&&cur===id)paintStop()}catch(e){}}}
function paintStop(){const id=cur,a=ARR.get(id),d=a&&a.data,g=group(d),s=STOPS.get(id),fav=P.favs.find(f=>String(f.id)===id);
 const name=(fav&&(fav.alias||fav.nombre))||(s&&s.nombre)||(d&&cap(d.nombre))||'Parada '+id;
 render(`<div><div class="hd"><div class="grow"><h2>${esc(name)}</h2><p class="sub">Parada ${esc(id)}${walkMin(s||fav)?' · '+walkMin(s||fav)+' min andando':''}</p></div>
 <button class="rb" id="fv" aria-label="Favorita" style="color:${fav?'#e89a00':'inherit'}">${fav?IC.starF:IC.star}</button><button class="rb" id="cl" aria-label="Cerrar">${IC.x}</button></div>
 ${a&&a.err&&!d?`<div class="warn">${esc(a.err)}</div>`:''}
 ${!d&&!(a&&a.err)?'<div class="skel"></div><div class="skel"></div>':g.map(x=>`<div class="row"><span class="badge" style="min-width:40px;height:28px;font-size:17px">${esc(x.linea)}</span><div class="grow"><b>${esc(x.destino)}</b><div class="nx">${x.m[1]!=null?'Siguiente en '+x.m[1]+' min':''}</div></div>${x.m[0]==null?'<span class="nx">sin estimación</span>':x.m[0]<=0?'<span class="min now">Llegando</span>':`<span class="min">${x.m[0]}<small>min</small></span>`}</div>`).join('')||(d?'<p class="sub">Ahora no hay buses con tiempo estimado.</p>':'')}
 <button class="btn" id="go">Cómo llegar aquí</button>
 <p class="fresh">${a&&a.at?'En directo · actualizado a las '+new Date(a.at).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):''}</p></div>`);
 $('#cl').onclick=()=>{renderHome()};
 $('#fv').onclick=()=>{if(fav)P.favs=P.favs.filter(f=>String(f.id)!==id);else{const o=s||{};P.favs.push({id,nombre:o.nombre||name,lat:o.lat,lon:o.lon})}save();drawFavs();paintStop()};
 $('#go').onclick=()=>{const t=s||fav;if(t&&t.lat!=null)openRoute({n:name,lat:t.lat,lon:t.lon})};setH()}

/* ---------- comparar formas de llegar ---------- */
const TAR={taxiB1:2.55,taxiB2:3.20,taxiKm1:1.40,taxiKm2:1.60,bus:1.50,bici:.50,moto:.27,coche:.19,inter:3.00};
const MODES={walk:['Andando',IC.walk],bici:['BiciMAD',IC.bike],bus:['Autobús EMT',IC.bus],moto:['Moto compartida',IC.moto],coche:['Coche compartido',IC.car],taxi:['Taxi',IC.taxi],vtc:['Uber / Cabify',IC.phone]};
function compare(O,D,wait){const km=Math.max(.2,hav(O,D)*1.3),d=new Date(),h=d.getHours(),T2=h>=21||h<7||d.getDay()===0||d.getDay()===6,night=h<6,money=x=>Math.round(x*20)/20,o=[];
 if(km<14)o.push({k:'walk',m:km/4.8*60,c:0,note:km.toFixed(1).replace('.',',')+' km'});
 if(km<10){const r=km/15*60;o.push({k:'bici',m:5+r,c:Math.ceil(r/30)*TAR.bici,note:'Tarifa de abonado'})}
 if(km<=14){const bw=wait!=null?wait:(night?15:6);o.push({k:'bus',name:night?'Búho (EMT)':null,m:5+bw+km/13*60,c:P.abono?0:TAR.bus,note:(wait!=null?'Sale en '+Math.round(wait)+' min':'Espera aprox. '+bw+' min')+(P.abono?' · con abono':'')})}
 else o.push({k:'bus',name:'Cercanías o interurbano',icon:IC.train,m:15+km/32*60,c:P.abono?0:TAR.inter,note:'Estimación aproximada'});
 if(km<25){const r=km/24*60;o.push({k:'moto',m:6+r,c:money(r*TAR.moto),note:'Acciona, Cooltra · carné necesario'})}
 {const r=km/(km>12?45:20)*60;o.push({k:'coche',m:12+r,c:money(r*TAR.coche),note:'Free2Move · incluye aparcar'})}

const PLACES=[['Sol',40.4169,-3.7035],['Callao',40.42,-3.7058],['Plaza de España',40.4233,-3.7123],['Moncloa',40.4351,-3.7189],['Argüelles',40.43,-3.7155],['Atocha',40.4075,-3.6915],['Cibeles',40.4193,-3.6931],['Colón',40.4253,-3.6903],['Retiro',40.4153,-3.6845],['Nuevos Ministerios',40.446,-3.692],['Plaza de Castilla',40.4664,-3.6886],['Chamartín (estación)',40.4722,-3.6826],['Bernabéu',40.4531,-3.6883],['Metropolitano',40.4362,-3.5995],['Cuatro Caminos',40.447,-3.7035],['Bilbao',40.429,-3.702],['Lavapiés',40.4089,-3.701],['La Latina',40.411,-3.709],['Embajadores',40.404,-3.703],['Legazpi',40.391,-3.695],['Méndez Álvaro',40.396,-3.678],['Goya',40.4243,-3.6758],['Manuel Becerra',40.4285,-3.669],['Avenida de América',40.438,-3.677],['Ópera',40.418,-3.7095],['Palacio Real',40.418,-3.7143],['Templo de Debod',40.424,-3.7178],['Museo del Prado',40.4138,-3.6921],['Reina Sofía',40.408,-3.6945],['Chueca',40.4229,-3.6975],['Malasaña',40.426,-3.7045],['Tribunal',40.4262,-3.701],['Alonso Martínez',40.4277,-3.6955],['Príncipe Pío',40.421,-3.72],['Ciudad Universitaria',40.444,-3.727],['Ventas',40.431,-3.663],['Pacífico',40.401,-3.675],['Tirso de Molina',40.4123,-3.7044],['Antón Martín',40.4125,-3.6985],['Gregorio Marañón',40.4378,-3.6915],['Quevedo',40.433,-3.704],['Tetuán',40.4605,-3.6985],['Aeropuerto T4',40.4919,-3.5932],['Aeropuerto T1',40.4673,-3.5718],['Alcalá de Henares',40.4818,-3.3643],['San Lorenzo de El Escorial',40.5926,-4.1474],['El Escorial',40.5826,-4.1272],['Aranjuez',40.0331,-3.6031],['Getafe',40.3057,-3.7329],['Móstoles',40.3223,-3.8649],['Alcorcón',40.3458,-3.8249],['Leganés',40.3272,-3.7635],['Fuenlabrada',40.2842,-3.7942],['Parla',40.2368,-3.7672],['Pozuelo de Alarcón',40.4351,-3.8136],['Las Rozas',40.4929,-3.8737],['Majadahonda',40.4735,-3.8718],['Boadilla del Monte',40.405,-3.878],['Alcobendas',40.5475,-3.642],['San Sebastián de los Reyes',40.5474,-3.6261],['Tres Cantos',40.6006,-3.7092],['Colmenar Viejo',40.659,-3.765],['Torrejón de Ardoz',40.456,-3.48],['Coslada',40.4238,-3.5613],['San Fernando de Henares',40.4248,-3.5336],['Rivas-Vaciamadrid',40.358,-3.54],['Mejorada del Campo',40.3953,-3.4869],['Arganda del Rey',40.301,-3.438],['Valdemoro',40.1907,-3.6789],['Collado Villalba',40.635,-4.005],['Guadarrama',40.672,-4.089],['Cercedilla',40.74,-4.057],['Navacerrada',40.729,-4.013],['Villaviciosa de Odón',40.358,-3.9],['Navalcarnero',40.289,-4.014]].map(([n,lat,lon])=>({n,lat,lon}));
let geoT=null;function geoSearch(q){clearTimeout(geoT);if(q.trim().length<3)return;geoT=setTimeout(async()=>{try{const near=ME?ME.lat+','+ME.lon:'40.4169,-3.7035';const r=await apiRuta({geo:q,near});if(view!=='search'||$('#si').value!==q)return;const box=document.createElement('div');box.innerHTML=r.filter(x=>x.lat!=null).map((x,i)=>`<button class="row" data-g="${i}">${IC.pin}<div class="grow"><b>${esc(x.n)}</b><div class="nx">${esc(x.zona||'')}</div></div></button>`).join('');box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const x=r[b.dataset.g];openRoute({n:x.n,lat:x.lat,lon:x.lon})});const ask=$('#res').querySelector('a.row');ask?$('#res').insertBefore(box,ask):$('#res').appendChild(box)}catch(e){}},400)}
function openSearch(){solo(false);view='search';card.classList.add('big');
 render(`<div><div class="hd"><div class="grow"><input class="inp" id="si" placeholder="Sitio, pueblo o nº de parada" autocomplete="off" enterkeyhint="search"></div><button class="rb" id="cl" aria-label="Cerrar">${IC.x}</button></div><div id="res"></div></div>`);
 const show=q=>{const n=q.replace(/\D/g,'');let h='';
  if(n&&n===q.trim())h+=`<button class="row" data-num="${esc(n)}">${IC.bus}<div class="grow"><b>Parada ${esc(n)}</b><div class="nx">Ver sus buses</div></div></button>`;
  h+=P.favs.filter(f=>q&&norm(f.alias||f.nombre).includes(norm(q))).map(f=>`<button class="row" data-num="${esc(f.id)}">${IC.starF}<div class="grow"><b>${esc(f.alias||f.nombre)}</b><div class="nx">Mi parada</div></div></button>`).join('');
  h+=PLACES.filter(p=>norm(p.n).includes(norm(q))).slice(0,q?8:6).map(p=>`<button class="row" data-p="${PLACES.indexOf(p)}">${IC.pin}<div class="grow"><b>${esc(p.n)}</b><div class="nx">Cómo llegar</div></div></button>`).join('');
  if(q.trim())h+=`<a class="row" style="text-decoration:none;color:inherit" target="_blank" rel="noopener" href="${claudeURL('Quiero ir a '+q)}">${IC.phone}<div class="grow"><b>Preguntar a Claude</b><div class="nx">«${esc(q)}»</div></div></a>`;
  $('#res').innerHTML=h;
  $('#res').querySelectorAll('[data-num]').forEach(b=>b.onclick=()=>openStop(b.dataset.num));
  $('#res').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openRoute(PLACES[b.dataset.p]));geoSearch(q)};
 $('#si').oninput=e=>show(e.target.value);show('');setTimeout(()=>$('#si').focus(),60);
 $('#cl').onclick=()=>{card.classList.remove('big');renderHome()};setH()}
$('#q').onclick=openSearch;

/* ---------- ajustes ---------- */
const ACC=['#1554d1','#d7263d','#0a8a5f','#6d3fd6','#d9580d','#2b3440'];
function openSettings(){$('#set').classList.add('open');$('#set').inert=false;setTimeout(()=>$('#setBack').focus(),350);$('#tSet').classList.add('on');$('#tMap').classList.remove('on');paintSettings()}
function paintSettings(){const tg=(on,t,attr)=>`<button class="tg${on?' on':''}" role="switch" aria-checked="${!!on}" ${attr}>${t}<i aria-hidden="true"></i></button>`;
 $('#setBody').innerHTML=`<div class="grp"><p class="lbl">Mis paradas</p>${P.favs.map((f,i)=>`<div class="row"><span class="grow"><input class="inp" data-alias="${i}" value="${esc(f.alias||f.nombre)}" style="height:40px" aria-label="Nombre"><span class="nx">Parada ${esc(f.id)}</span></span><button class="rb" data-del="${i}" aria-label="Quitar">${IC.x}</button></div>`).join('')}
 <div style="display:flex;gap:8px;margin-top:8px"><input class="inp" id="addn" inputmode="numeric" placeholder="Añadir nº de parada"><button class="btn" id="addb" style="width:auto;padding:0 18px;margin:0;height:46px">Añadir</button></div><p class="nx" style="margin-top:6px">Truco: toca la estrella dentro de cualquier parada.</p></div>
 <div class="grp"><p class="lbl">Formas de moverme</p>${Object.entries(MODES).map(([k,[n]])=>tg(P.modes[k]!==false,n,`data-mode="${k}"`)).join('')}${tg(P.abono,'Tengo abono transporte','data-t="abono"')}</div>
 <div class="grp"><p class="lbl">Mapa</p><div class="chips" style="flex-wrap:wrap">${[['claro','Claro'],['detallado','Detallado'],['vivo','Vivo'],['noche','Noche']].map(([v,t])=>`<button class="chip${P.style===v?' on':''}" aria-pressed="${P.style===v}" data-st="${v}">${t}</button>`).join('')}</div>
 ${tg(P.buses,'Ver los buses moviéndose','data-t="buses"')}<p class="lbl">Color</p><div class="sw">${ACC.map(c=>`<button data-c="${c}" class="${P.acc===c?'on':''}" style="background:${c}" aria-pressed="${P.acc===c}" aria-label="Color ${({'#1554d1':'azul','#d7263d':'rojo','#0a8a5f':'verde','#6d3fd6':'morado','#d9580d':'naranja','#2b3440':'gris'})[c]||''}"></button>`).join('')}</div></div>
 <div class="grp"><p class="lbl">Voz</p>${tg(P.speak,'Leerme las respuestas en voz alta','data-t="speak"')}</div>
 <div class="grp"><p class="lbl">Accesibilidad</p>${tg(P.bigText,'Texto más grande','data-t="bigText"')}${tg(P.calm,'Menos animaciones','data-t="calm"')}</div>
 <p class="nx" style="text-align:center">Datos de la EMT en directo · mapa © OpenStreetMap</p>`;
 const re=()=>{save();applyPrefs();const y=$('#set').scrollTop;paintSettings();$('#set').scrollTop=y};
 $('#setBody').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{P.modes={...P.modes,[b.dataset.mode]:P.modes[b.dataset.mode]===false};re()});
 $('#setBody').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{P[b.dataset.t]=!P[b.dataset.t];re();if(b.dataset.t==='buses')refresh()});
 $('#setBody').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const old=P.style;P.style=b.dataset.st;re();if(STY[old]!==STY[P.style])map.setStyle(STY[P.style])});
 $('#setBody').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{P.acc=b.dataset.c;re()});
 $('#setBody').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{P.favs.splice(+b.dataset.del,1);drawFavs();re()});
 $('#setBody').querySelectorAll('[data-alias]').forEach(i=>i.onchange=()=>{P.favs[+i.dataset.alias].alias=i.value.trim().slice(0,40);save();drawFavs()});
 const add=async()=>{const n=($('#addn').value||'').replace(/\D/g,'');if(!n)return;try{const s=await api('info_parada',{parada:n});P.favs.push({id:n,nombre:cap(s.nombre),lat:s.coordenadas&&s.coordenadas.lat,lon:s.coordenadas&&s.coordenadas.lon});save();drawFavs();refresh();re()}catch(e){alertBox(e.message)}};
 $('#addb').onclick=add;$('#addn').onkeydown=e=>{if(e.key==='Enter')add()}}
const alertBox=t=>{$('#setBody').insertAdjacentHTML('afterbegin',`<div class="warn">${esc(t)}</div>`)};
function applyPrefs(){document.body.classList.toggle('bigtext',!!P.bigText);document.body.classList.toggle('calm',!!P.calm);document.documentElement.style.setProperty('--acc',P.acc);document.body.classList.toggle('night',P.style==='noche');if(map.getLayer('stops'))map.setPaintProperty('stops','circle-stroke-color',P.acc);drawFavs();updateBuses()}
$('#tSet').onclick=openSettings;
$('#setBack').onclick=()=>{$('#set').classList.remove('open');$('#set').inert=true;$('#tSet').classList.remove('on');$('#tMap').classList.add('on');rerender()};
$('#tMap').onclick=()=>{$('#set').classList.remove('open');$('#set').inert=true;$('#tSet').classList.remove('on');$('#tMap').classList.add('on');card.classList.remove('big');renderHome();if(ME)map.flyTo({center:[ME.lon,ME.lat],zoom:15.3});else map.flyTo({center:[-3.7035,40.4169],zoom:11.6})};

/* ---------- voz (Safari) + Claude ---------- */
const claudeURL=t=>'https://claude.ai/new?q='+encodeURIComponent(t+(ME?` (estoy en ${ME.lat.toFixed(4)}, ${ME.lon.toFixed(4)})`:'')+'. Usa el conector EMT MADRID.');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,heard='';
function say(t,quiet){if(!quiet)$('#vText').textContent=t;if(!P.speak||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=1.02;const v=speechSynthesis.getVoices().find(v=>/^es(-|_)ES/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function openVoice(){$('#voice').classList.add('open');$('#voice').inert=false;setTimeout(()=>$('#vTalk').focus(),300);$('#vText').textContent='Toca y habla';$('#vSub').textContent='Prueba: «¿Cuándo pasa mi bus?» o «Llévame a Moncloa».';$('#vClaude').href=claudeURL('Ayúdame a moverme por Madrid');listen()}
function listen(){if(!SR){$('#vText').textContent='Este navegador no deja usar el micrófono aquí.';$('#vSub').textContent='Toca «Seguir con Claude» y usa su modo de voz.';return}
 try{rec&&rec.abort()}catch(e){}rec=new SR();rec.lang='es-ES';rec.interimResults=true;rec.continuous=false;heard='';
 rec.onstart=()=>{$('#vOrb').classList.add('listen');$('#vText').textContent='Te escucho…'};
 rec.onresult=e=>{heard=[...e.results].map(r=>r[0].transcript).join(' ');$('#vText').textContent=heard};
 rec.onerror=e=>{$('#vOrb').classList.remove('listen');if(e.error==='not-allowed')$('#vSub').textContent='Permite el micrófono: Ajustes del iPhone → Safari → Micrófono.';};
 rec.onend=()=>{$('#vOrb').classList.remove('listen');if(heard.trim())intent(heard.trim())};
 try{rec.start()}catch(e){}}
function intent(t){const n=norm(t);$('#vClaude').href=claudeURL(t);
 const dest=n.match(/(?:llevame|ir|voy|llegar|llego|vamos|como voy|como llego)\s+(?:a|al|hasta|en)\s+(.+)$/)||n.match(/^(?:a|al|hasta)\s+(.+)$/);
 if(dest){const q=dest[1].replace(/^(la|el|los|las)\s+/,'').trim();const p=PLACES.find(p=>norm(p.n)===q)||PLACES.find(p=>norm(p.n).includes(q)||q.includes(norm(p.n)));
  if(p){$('#vText').textContent='Buscando la mejor ruta a '+p.n+'…';($('#voice').classList.remove('open'),$('#voice').inert=true);openRoute(p,{speak:true});return}
  apiRuta({geo:q,near:ME?ME.lat+','+ME.lon:'40.4169,-3.7035'}).then(r=>{const x=r.find(x=>x.lat!=null);if(x){($('#voice').classList.remove('open'),$('#voice').inert=true);openRoute({n:x.n,lat:x.lat,lon:x.lon},{speak:true})}else{say('No encuentro ese sitio. Te paso con Claude.')}}).catch(()=>say('No encuentro ese sitio.'));return}
  if(false){
  }
 if(/cuando|cuanto|proximo|pasa|llega|bus/.test(n)){const h=nextBus();if(h){const f=P.favs.find(f=>String(f.id)===h.id);say(`El ${h.g.linea} hacia ${h.g.destino} pasa por ${(f&&(f.alias||f.nombre))||(h.st&&h.st.nombre)||'tu parada'} ${h.m<=0?'ahora mismo':'en '+h.m+' minutos'}.${h.w?(h.m-h.w<=1?' Sal ya.':' Sal en '+(h.m-h.w)+' minutos.'):''}`)}else say('Ahora no veo buses con tiempo estimado en tus paradas.');return}
 say('Eso te lo resuelve mejor Claude.');$('#vSub').textContent='Toca «Seguir con Claude» y te lo explica con datos de la EMT.'}
$('#tVoice').onclick=openVoice;$('#vTalk').onclick=listen;$('#vClose').onclick=()=>{($('#voice').classList.remove('open'),$('#voice').inert=true);try{rec&&rec.abort();speechSynthesis.cancel()}catch(e){}};

/* ---------- arranque ---------- */
applyPrefs();renderHome();
if(!KEY)toast('Abre la app con tu enlace que lleva ?key= para ver los datos en directo.');
map.on('load',()=>{refresh();startGPS()});
if('speechSynthesis' in window)speechSynthesis.getVoices();
}
</script>

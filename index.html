<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parada</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parada">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: silencio. Una pregunta, una respuesta.
   IDEA: el panel de un andén de noche: negro, letras blancas, el color solo para las líneas
   PICTURE: la frase del trayecto, enorme, con la línea pintada de su color
   COLOUR and TYPE: negro puro, blanco, grises; color de cada línea; rojo solo para la prisa. Inter Tight
   LAYOUT: una columna, mucho aire, todo a la izquierda como un cartel */
:root{color-scheme:dark;--bg:#000;--ink:#f5f5f5;--mute:#8a8a8f;--dim:#3a3a3e;--red:#ff453a;--ease:cubic-bezier(.2,.85,.25,1)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{font:18px/1.4 'Inter Tight',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:6px}
.scr{position:fixed;inset:0;overflow-y:auto;padding:max(28px,calc(env(safe-area-inset-top) + 18px)) 26px calc(40px + env(safe-area-inset-bottom));transition:opacity .45s var(--ease),transform .45s var(--ease)}
.scr.off{opacity:0;transform:translateY(18px);pointer-events:none;visibility:hidden;transition:opacity .3s,transform .3s,visibility 0s .3s}
.wrap{max-width:620px;margin:0 auto}
/* pantalla 1 */
#ask .wrap{padding-top:16vh}
label.q{display:block;font-size:15px;color:var(--mute);margin-bottom:10px;font-weight:500}
#q{width:100%;background:none;border:0;border-bottom:1.5px solid var(--dim);color:var(--ink);font:700 clamp(32px,9vw,46px)/1.15 'Inter Tight',sans-serif;letter-spacing:-.02em;padding:4px 0 12px;outline:none;caret-color:var(--red);border-radius:0;-webkit-appearance:none}
#q::placeholder{color:#4a4a4f}
#q:focus{border-bottom-color:#fff}
#list{list-style:none;margin:14px 0 0;padding:0}
#list button{display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid #161618}
#list b{display:block;font-size:20px;font-weight:600}
#list span{font-size:14px;color:var(--mute)}
#list .hdr{font-size:13px;color:var(--mute);padding:18px 0 4px;border:0}
#where{margin-top:26px;font-size:14px;color:var(--mute)}
#where button{text-decoration:underline;text-underline-offset:3px}
/* permisos y micro */
.pk{font-size:15px;color:var(--mute);font-weight:500;margin:0 0 10px}
.ph{font:800 clamp(34px,9.5vw,50px)/1.05 'Inter Tight',sans-serif;letter-spacing:-.03em;margin:0}
.pl{list-style:none;padding:0;margin:34px 0 40px;display:grid;gap:20px}
.pl b{display:block;font-size:21px;font-weight:700}
.pl span{color:var(--mute);font-size:16px}
.pbtn{display:block;width:100%;height:58px;border-radius:29px;background:#fff;color:#000;font-weight:700;font-size:18px}
.plink{display:block;margin:16px auto 0;color:var(--mute);font-size:16px;padding:12px}
.qrow{display:flex;align-items:flex-end;gap:12px}
.qrow #q{flex:1}
#mic{width:52px;height:52px;border-radius:50%;background:#141416;display:grid;place-items:center;flex:none;margin-bottom:8px;transition:background .2s,transform .2s}
#mic svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mic.on{background:var(--red);animation:lv 1.1s ease-in-out infinite}
@keyframes lv{50%{transform:scale(1.08);box-shadow:0 0 0 10px rgba(255,69,58,.18)}}
/* contexto del croquis */
.crq .cpk{fill:#0f2a1a;opacity:.75}
.crq .crv{fill:none;stroke:#0f3a5a;stroke-width:3.2;stroke-linecap:round;opacity:.9}
.crq .crd{fill:none;stroke:#26262d;stroke-linecap:round;stroke-linejoin:round}
.crq .clm{fill:#4a4a52}
.crq .ctl{fill:#5d5d66;font-size:7.5px;font-weight:600}
.crq .cscale{fill:none;stroke:#6b6b73;stroke-width:1.2}
.crq .cnorth{fill:#6b6b73}
.crq .cis{fill:#000;stroke:#fff;stroke-width:1;opacity:.85}
.crq .clin{font:800 10px 'Inter Tight',sans-serif}
.crq .cwm{fill:#9a9aa2;font-size:7.5px}
/* billete origen → destino */
.top{margin-bottom:22px}
.tk{position:relative;background:linear-gradient(160deg,#101014,#0a0a0d);border:1px solid #1d1d22;border-radius:22px;padding:18px 18px 18px 16px;margin-bottom:30px}
.tk-r{display:flex;gap:14px;align-items:flex-start}
.tk-bk{position:absolute;top:12px;right:12px}
.tk-r>div{padding-right:44px}
.tk-r b{display:block;font-size:clamp(20px,5.6vw,26px);font-weight:700;line-height:1.15;letter-spacing:-.015em}
.tk-l{display:block;font-size:13px;color:var(--mute);font-weight:500;margin-bottom:2px}
.tk-z{display:block;font-size:14px;color:var(--mute);margin-top:2px}
.tk-d{width:16px;height:16px;border-radius:50%;flex:none;margin-top:24px}
.tk-d.from{background:#000;border:3.5px solid #fff;box-shadow:0 0 12px rgba(255,255,255,.35)}
.tk-d.to{background:var(--red);box-shadow:0 0 14px rgba(255,69,58,.6)}
.tk-line{width:2px;height:22px;margin:4px 0 4px 7px;background:repeating-linear-gradient(#555 0 4px,transparent 4px 8px)}
.crq .ctd{fill:#ff8a80}
/* croquis */
.crq{margin:28px -8px 0;border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#0b0d14,#000);border:1px solid #17171c;box-shadow:inset 0 0 40px rgba(80,120,255,.06)}
.crq svg{display:block;width:100%;height:auto}
.crq .hud{fill:none;stroke:#ffffff;stroke-opacity:.28;stroke-width:1.2}
.crq .cg{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.35;filter:url(#gl)}
.crq .cl{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s var(--ease) forwards}
.crq .cw{fill:none;stroke:#8e8e96;stroke-width:2;stroke-dasharray:2 5;stroke-linecap:round;opacity:0;animation:fadein .6s forwards}
.crq .cn{fill:#000;stroke-width:2.5}
.crq .ct{font:600 9px ui-monospace,'SF Mono',Menlo,monospace;fill:#d4d4d8;letter-spacing:.06em}
.crq .ct2{fill:#fff;font-size:10px;font-weight:700}
.crq .ct3{fill:#6b6b73;font-size:8px}
.crq .me-r{fill:none;stroke:#fff;stroke-width:1.5;opacity:.6;animation:ring 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.crq .de-r{fill:none;stroke:#ff453a;stroke-width:1.5;animation:ring 2s ease-out .6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fadein{to{opacity:.9}}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@media(prefers-reduced-motion:reduce){.crq .cl{stroke-dashoffset:0}.crq .cw{opacity:.9}.crq .comet{display:none}}
/* pantalla 2 */
.top{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.back{width:44px;height:44px;border-radius:50%;background:#141416;display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.to{font-size:15px;color:var(--mute);line-height:1.25}
.to b{display:block;color:var(--ink);font-size:17px;font-weight:600}
.head{font:800 clamp(48px,15vw,76px)/.95 'Inter Tight',sans-serif;letter-spacing:-.04em}
.head small{font-size:.38em;font-weight:600;letter-spacing:-.01em;color:var(--mute);margin-left:4px}
.when{font-size:20px;font-weight:600;margin:10px 0 0;color:var(--mute)}
.when.now{color:var(--red)}
.steps{list-style:none;margin:40px 0 0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 30px 26px;font-size:clamp(23px,6.4vw,30px);line-height:1.22;font-weight:600;letter-spacing:-.015em}
.steps li::before{content:"";position:absolute;left:0;top:.42em;width:10px;height:10px;border-radius:50%;background:var(--c,#555)}
.steps li::after{content:"";position:absolute;left:4px;top:calc(.42em + 16px);bottom:6px;width:2px;background:var(--c,#2a2a2c);opacity:.55}
.steps li.walk{color:#c9c9cd;font-weight:500}
.steps li.walk::before{background:#555}.steps li.walk::after{background:repeating-linear-gradient(#444 0 4px,transparent 4px 9px);opacity:1}
.steps li:last-child::after{display:none}
.steps li.end::before{background:var(--red)}
.ln{display:inline-flex;align-items:center;justify-content:center;min-width:1.55em;height:1.3em;padding:0 .3em;border-radius:.32em;font-weight:800;font-size:.95em;vertical-align:-.12em;margin:0 .08em}
.steps em{font-style:normal;color:var(--c,#fff)}
.det{display:block;font-size:15px;font-weight:500;color:var(--mute);margin-top:8px;letter-spacing:0}
.more{display:flex;gap:28px;margin-top:20px;font-size:16px;font-weight:600;color:var(--mute)}
.more button{padding:12px 0}
.msg{font-size:24px;font-weight:600;line-height:1.3;margin-top:30vh}
.msg small{display:block;font-size:15px;color:var(--mute);font-weight:500;margin-top:12px}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;margin-right:10px;animation:p 1s ease-in-out infinite;vertical-align:middle}
@keyframes p{50%{opacity:.2}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="perm" class="scr off" aria-label="Permisos">
 <div class="wrap" style="padding-top:14vh">
  <p class="pk">Parada</p>
  <h1 class="ph">Para guiarte necesito dos cosas.</h1>
  <ul class="pl">
   <li><b>Tu ubicación</b><span>Para calcular la ruta desde donde estás.</span></li>
   <li><b>Tu micrófono</b><span>Para que me digas a dónde vas.</span></li>
  </ul>
  <button class="pbtn" id="allow">Permitir</button>
  <button class="plink" id="skip">Ahora no</button>
 </div>
</main>
<main id="ask" class="scr off" aria-label="Buscar destino">
 <div class="wrap">
  <label class="q" for="q">Parada</label>
  <div class="qrow"><input id="q" type="search" placeholder="¿A dónde vas?" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-controls="list" aria-describedby="where">
  <button id="mic" aria-label="Decir a dónde vas"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div>
  <ul id="list" role="listbox" aria-label="Destinos"></ul>
  <p id="where"></p>
 </div>
</main>
<main id="go" class="scr off" aria-label="Tu trayecto" aria-live="polite"><div class="wrap" id="out"></div></main>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const hhmm=t=>t?new Date(t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'';
const minsTo=t=>t?Math.round((new Date(t)-Date.now())/60000):null;
const KEY=new URLSearchParams(location.search).get('key')||(()=>{try{return localStorage.getItem('parada-key')}catch(e){return ''}})()||'';
try{if(KEY)localStorage.setItem('parada-key',KEY)}catch(e){}
const API=/vercel\.app$/.test(location.host)?'':'https://tdmaps.vercel.app';
async function ruta(p){const r=await fetch(API+'/api/ruta?'+new URLSearchParams({...p,key:KEY}));const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status===401?'Falta la clave: abre la app con tu enlace que lleva ?key=':j.error||'No hay conexión');return j}

/* recientes */
let REC=[];try{REC=JSON.parse(localStorage.getItem('parada-rec')||'[]')}catch(e){}
const remember=d=>{REC=[d,...REC.filter(x=>x.n!==d.n)].slice(0,6);try{localStorage.setItem('parada-rec',JSON.stringify(REC))}catch(e){}};

/* ubicación */
let ME=null,gpsMsg='';
function gps(){if(!('geolocation' in navigator)){gpsMsg='no';paintWhere();return}
 navigator.geolocation.watchPosition(p=>{ME={lat:p.coords.latitude,lon:p.coords.longitude};gpsMsg='ok';paintWhere()},e=>{gpsMsg=e.code===1?'denied':'no';paintWhere()},{enableHighAccuracy:true,maximumAge:15000,timeout:20000})}
function paintWhere(){const w=$('#where');if(!KEY){w.textContent='Abre la app con tu enlace que lleva ?key=';return}if(gpsMsg==='ok'){w.textContent='Desde donde estás.'}else if(gpsMsg==='denied'){w.innerHTML='Sin tu ubicación calculo desde Sol. <button id="gp">Activarla</button>';$('#gp').onclick=()=>alert('Ajustes del iPhone → Privacidad → Localización → Safari → «Al usar la app».')}else w.textContent=gpsMsg==='no'?'Calculo desde Sol.':'Buscando tu ubicación…'}

/* colores de línea */
const METRO={'1':'#2DBEF0','2':'#ED1C24','3':'#FFD000','4':'#B65518','5':'#8FD400','6':'#98989B','7':'#EE7518','8':'#EC82B1','9':'#A60084','10':'#005AA9','11':'#009B3A','12':'#A49800','R':'#FFFFFF'};
const kind=m=>/SUBWAY|METRO/.test(m)?'metro':/TRAM|LIGHT/.test(m)?'ligero':/RAIL|SUBURBAN|TRAIN/.test(m)?'tren':/COACH/.test(m)?'inter':/BUS/.test(m)?'bus':'pie';
function color(l){const k=kind(l.mode);const ln=String(l.line||'').replace(/^L/i,'');if(k==='metro'&&METRO[ln])return METRO[ln];if(l.color&&l.color!=='#'&&!/^#?(000000|ffffff)$/i.test(l.color))return l.color.startsWith('#')?l.color:'#'+l.color;return{metro:'#ED1C24',ligero:'#3A9B5C',tren:'#E2001A',inter:'#3FA535',bus:'#1E6FE0'}[k]||'#888'}
const ink=c=>{const h=c.replace('#','');const [r,g,b]=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255);return(.299*r+.587*g+.114*b)>.62?'#000':'#fff'};
const pill=(l,c)=>`<span class="ln" style="background:${c};color:${ink(c)}">${esc(String(l.line||'').replace(/^L(?=\d)/i,''))}</span>`;
const what=l=>({metro:'la línea',ligero:'el Metro Ligero',tren:'el Cercanías',inter:'el interurbano',bus:'el bus'})[kind(l.mode)];

/* pantalla 1: buscar */
const q=$('#q'),list=$('#list');let gT=null,seq=0;
function show(items,hdr){if(voice&&!hdr&&items.length){voice=false;const t=norm(q.value);if(norm(items[0].n).includes(t)||t.includes(norm(items[0].n))){go(items[0]);return}}list.innerHTML=(hdr?`<li class="hdr" role="presentation">${esc(hdr)}</li>`:'')+items.map((x,i)=>`<li role="presentation"><button role="option" data-i="${i}"><b>${esc(x.n)}</b>${x.zona?`<span>${esc(x.zona)}</span>`:''}</button></li>`).join('');
 list.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>go(items[+b.dataset.i]))}
function idle(){REC.length?show(REC,'Recientes'):list.innerHTML=''}
q.addEventListener('input',()=>{const t=q.value.trim();clearTimeout(gT);if(t.length<2){idle();return}const my=++seq;
 gT=setTimeout(async()=>{try{const near=ME?ME.lat+','+ME.lon:'40.4169,-3.7035';const r=(await ruta({geo:t,near})).filter(x=>x.lat!=null);if(my===seq)show(r)}catch(e){if(my===seq)list.innerHTML=`<li class="hdr">${esc(e.message)}</li>`}},300)});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=list.querySelector('[data-i]');b&&b.click()}});

/* mini croquis futurista de la ruta */
const CTX={roads:[
 [9,[[40.497,-3.69],[40.478,-3.625],[40.43,-3.603],[40.382,-3.622],[40.356,-3.69],[40.37,-3.758],[40.42,-3.787],[40.47,-3.762],[40.497,-3.69]]],
 [6,[[40.4664,-3.6886],[40.48,-3.686],[40.497,-3.684]]],

 [9,[[40.4664,-3.6886],[40.4566,-3.6905],[40.446,-3.692],[40.4378,-3.6915],[40.4253,-3.6903],[40.4193,-3.6931],[40.4155,-3.6942],[40.4075,-3.6915],[40.398,-3.693],[40.391,-3.695]]],

 [7,[[40.4169,-3.7035],[40.418,-3.699],[40.4193,-3.6931],[40.42,-3.6888],[40.4243,-3.6758],[40.4285,-3.669],[40.431,-3.663],[40.436,-3.645]]],
 [7,[[40.4233,-3.7123],[40.43,-3.7155],[40.4351,-3.7189],[40.447,-3.728]]],
 [6,[[40.4169,-3.7035],[40.4155,-3.7074],[40.4155,-3.714]]],

 [6,[[40.4155,-3.7074],[40.411,-3.709],[40.407,-3.711],[40.402,-3.7115],[40.393,-3.712]]],
 [6,[[40.407,-3.711],[40.404,-3.703],[40.4075,-3.6915],[40.403,-3.676],[40.4,-3.662]]],

 [5,[[40.4285,-3.669],[40.415,-3.669],[40.401,-3.675]]],

function dec(str,prec=6){let i=0,lat=0,lon=0;const f=10**prec,out=[];while(i<str.length){for(const k of[0,1]){let b,sh=0,res=0;do{b=str.charCodeAt(i++)-63;res|=(b&31)<<sh;sh+=5}while(b>=32);const d=res&1?~(res>>1):res>>1;if(k===0)lat+=d;else lon+=d}out.push([lat/f,lon/f])}return out}
function croquis(it,O,D){const legs=it.legs;let prev=[O.lat,O.lon];const segs=[];
 legs.forEach((l,i)=>{let pts=[];try{if(l.geom)pts=dec(l.geom,l.precision||6)}catch(e){pts=[]}
  if(pts.length<2){const a=l.fromLL||prev,nx=legs[i+1],b=l.toLL||(nx&&nx.fromLL)||(i===legs.length-1?[D.lat,D.lon]:null);if(a&&b)pts=[a,b]}
  if(pts.length>=2){const step=Math.max(1,Math.floor(pts.length/70));pts=pts.filter((p,k)=>k%step===0||k===pts.length-1);segs.push({l,pts});prev=pts[pts.length-1]}});
 if(!segs.length)return'';
 const all=segs.flatMap(s=>s.pts).concat([[O.lat,O.lon],[D.lat,D.lon]]);const cl=Math.cos(all[0][0]*Math.PI/180);
 const xs=all.map(p=>p[1]*cl),ys=all.map(p=>-p[0]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const W=340,H=250,pad=34,k=Math.min((W-2*pad)/Math.max(x1-x0,1e-6),(H-2*pad)/Math.max(y1-y0,1e-6));const ox=(W-(x1-x0)*k)/2,oy=(H-(y1-y0)*k)/2;
 const P=p=>[(p[1]*cl-x0)*k+ox,(-p[0]-y0)*k+oy];const d=pts=>pts.map((p,j)=>{const[x,y]=P(p);return(j?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ');
 const full=segs.map(s=>d(s.pts)).join(' ').replace(/ M/g,' L');
 const [sx,sy]=P([O.lat,O.lon]),[ex,ey]=P([D.lat,D.lon]);
 const inb=([la,lo])=>{const[x,y]=P([la,lo]);return x>-40&&x<W+40&&y>-40&&y<H+40};
 let ctxs='';
 CTX.parks.forEach(pk=>{if(pk.some(inb))ctxs+=`<path d="${d(pk)}Z" class="cpk"/>`});
 if(CTX.river.some(inb))ctxs+=`<path d="${d(CTX.river)}" class="crv"/>`;
 CTX.roads.forEach(([w,a])=>{if(a.some(inb))ctxs+=`<path d="${d(a)}" class="crd" style="stroke-width:${(w>=9?2.2:1.3)}"/>`});
 const used=[[sx0(),sy0()]];function sx0(){return P([O.lat,O.lon])[0]}function sy0(){return P([O.lat,O.lon])[1]}
 segs.forEach(s=>{if(s.l.mode!=='WALK'){used.push(P(s.pts[0]),P(s.pts[s.pts.length-1]))}});used.push(P([D.lat,D.lon]));
 const lms=LM.map(([n,la,lo])=>({n,p:P([la,lo])})).filter(o=>o.p[0]>20&&o.p[0]<W-20&&o.p[1]>40&&o.p[1]<H-26&&used.every(u=>Math.hypot(u[0]-o.p[0],u[1]-o.p[1])>34));
 const pick=[];lms.forEach(o=>{if(pick.length<6&&pick.every(q=>Math.hypot(q.p[0]-o.p[0],q.p[1]-o.p[1])>48))pick.push(o)});
 pick.forEach(o=>{ctxs+=`<circle cx="${o.p[0].toFixed(1)}" cy="${o.p[1].toFixed(1)}" r="1.6" class="clm"/><text x="${o.p[0].toFixed(1)}" y="${(o.p[1]-5).toFixed(1)}" text-anchor="middle" class="ct ctl">${esc(o.n.toUpperCase())}</text>`});
 const mpp=111320/k;const nice=[50,100,200,250,500,1000,2000,5000,10000].find(v=>v/mpp>=46)||10000;const bl=nice/mpp;
 ctxs+=`<path d="M18 30h${bl.toFixed(1)}M18 27v6M${(18+bl).toFixed(1)} 27v6" class="cscale"/><text x="18" y="23" class="ct ct3">${nice>=1000?nice/1000+' KM':nice+' M'}</text>`;
 ctxs+=`<g transform="translate(${W-24} 30)"><path d="M0 -10L5 4L0 1L-5 4Z" class="cnorth"/><text y="15" text-anchor="middle" class="ct ct3">N</text></g>`;
 let paths='',nodes='',delay=0;
 segs.forEach((s,i)=>{const walk=s.l.mode==='WALK',c=walk?'#9a9aa2':color(s.l),dd=d(s.pts);

  let mid=sp[0];{const h=tot/2;let j=1;while(j<sp.length-1&&cum[j]<h)j++;const t=(h-cum[j-1])/((cum[j]-cum[j-1])||1);mid=[sp[j-1][0]+(sp[j][0]-sp[j-1][0])*t,sp[j-1][1]+(sp[j][1]-sp[j-1][1])*t]}
  if(walk){paths+=`<path d="${dd}" class="cw" style="animation-delay:${delay}s"/>`;{const po=P([O.lat,O.lon]),pd=P([D.lat,D.lon]);if((s.l.min||0)>=2&&Math.hypot(mid[0]-po[0],mid[1]-po[1])>42&&Math.hypot(mid[0]-pd[0],mid[1]-pd[1])>60)nodes+=`<text x="${(mid[0]+6).toFixed(1)}" y="${(mid[1]+3).toFixed(1)}" class="ct cwm">${s.l.min}′ A PIE</text>`}}

   const lbl=String(s.l.line||'').replace(/^L(?=\d)/i,'');const bw=Math.max(18,lbl.length*7+10);nodes+=`<g transform="translate(${mid[0].toFixed(1)} ${mid[1].toFixed(1)})"><rect x="${-bw/2}" y="-8" width="${bw}" height="16" rx="5" fill="${c}"/><text y="4" text-anchor="middle" class="clin" fill="${ink(c)}">${esc(lbl)}</text></g>`}
  delay+=.45;
  if(!walk){const[a,b]=P(s.pts[0]),[c2,d2]=P(s.pts[s.pts.length-1]);
   nodes+=`<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="4" class="cn" stroke="${c}"/><circle cx="${c2.toFixed(1)}" cy="${d2.toFixed(1)}" r="4" class="cn" stroke="${c}"/>`;
   const lx=Math.min(W-6,Math.max(6,c2+8)),anchor=c2>W*.6?'end':'start',tx=anchor==='end'?c2-8:lx;
   nodes+=`<text x="${tx.toFixed(1)}" y="${(d2-7).toFixed(1)}" text-anchor="${anchor}" class="ct">${esc(String(s.l.to||'').toUpperCase().slice(0,22))}</text>`}});
 const tag=(x,y,t,anchor)=>`<text x="${x.toFixed(1)}" y="${(y+18).toFixed(1)}" text-anchor="${anchor}" class="ct ct2">${t}</text>`;
 return `<figure class="crq" aria-label="Croquis de la ruta desde tu ubicación hasta ${esc(D.n)}"><svg viewBox="0 0 ${W} ${H}" role="img">
 <defs><pattern id="gr" width="17" height="17" patternUnits="userSpaceOnUse"><path d="M17 0H0V17" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>

 <path d="M8 22V8h14M${W-22} 8h14v14M8 ${H-22}v14h14M${W-22} ${H-8}h14v-14" class="hud"/>
 <text x="14" y="${H-14}" class="ct ct3">${O.lat.toFixed(4)}°N ${Math.abs(O.lon).toFixed(4)}°W</text><text x="${W-14}" y="${H-14}" text-anchor="end" class="ct ct3">${(it.min||0)} MIN · ${segs.filter(s=>s.l.mode!=='WALK').length} LÍNEA${segs.filter(s=>s.l.mode!=='WALK').length===1?'':'S'}</text>
 ${ctxs}${paths}${nodes}
 <circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="9" class="me-r"/><circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="5" fill="#fff"/>${tag(sx,sy,'TÚ',sx>W*.7?'end':sx<W*.3?'start':'middle')}${tag(ex,ey-36,esc(String(D.n).toUpperCase().slice(0,24)),ex>W*.7?'end':ex<W*.3?'start':'middle').replace('ct ct2','ct ct2 ctd')}

/* pantalla 2: el trayecto */
let R=null,tick=null;
function screen(id){$('#perm').classList.add('off');$('#ask').classList.toggle('off',id!=='ask');$('#go').classList.toggle('off',id!=='go');$('#'+id).scrollTop=0}
let FROM='Tu ubicación';
const top=d=>`<div class="tk" role="group" aria-label="Sales de ${esc(FROM)} y vas a ${esc(d.n)}"><button class="back tk-bk" id="bk" aria-label="Nueva búsqueda"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
 <div class="tk-r"><span class="tk-d from" aria-hidden="true"></span><div><span class="tk-l">Sales de</span><b id="fromN">${esc(FROM)}</b></div></div>
 <div class="tk-line" aria-hidden="true"></div>
 <div class="tk-r"><span class="tk-d to" aria-hidden="true"></span><div><span class="tk-l">Vas a</span><b>${esc(d.n)}</b>${d.zona?`<span class="tk-z">${esc(d.zona)}</span>`:''}</div></div>
</div>`;
async function go(d){remember(d);q.blur();screen('go');const out=$('#out');FROM=ME?'Tu ubicación':'Puerta del Sol';
 if(ME)ruta({rev:ME.lat+','+ME.lon}).then(r=>{if(r&&r.n){FROM=r.n;const f=$('#fromN');if(f)f.textContent=FROM}}).catch(()=>{});
 out.innerHTML=top(d)+`<p class="msg"><span class="pulse"></span>Buscando el mejor camino…</p>`;$('#bk').onclick=back;
 const O=ME||{lat:40.4169,lon:-3.7035};
 try{const j=await ruta({from:O.lat+','+O.lon,to:d.lat+','+d.lon});const its=(j.itinerarios||[]).filter(i=>i.legs.some(l=>l.mode!=='WALK'));const walk=(j.directo||[])[0];
  R={d,its,walk,i:0,O};if(!its.length&&walk){R.its=[walk]}if(!R.its.length)throw new Error('No encuentro cómo llegar ahora mismo.');paint();clearInterval(tick);tick=setInterval(paint,20000)}
 catch(e){out.innerHTML=top(d)+`<p class="msg">${esc(e.message)}<small>Prueba otra vez en un momento.</small></p>`;$('#bk').onclick=back}}
function paint(){if(!R)return;const it=R.its[R.i],d=R.d,legs=it.legs.filter(l=>!(l.mode==='WALK'&&(l.min||0)<1));const lv=minsTo(it.start);
 const steps=[];legs.forEach((l,i)=>{const nx=legs[i+1];
  if(l.mode==='WALK'){const to=nx?nx.from:d.n;steps.push(`<li class="walk">Anda ${Math.max(1,l.min)} min hasta ${i===legs.length-1?'tu destino':`<b>${esc(to||'la parada')}</b>`}.</li>`);return}
  const c=color(l);const k=kind(l.mode);
  steps.push(`<li style="--c:${c}">Coge ${what(l)} ${pill(l,c)}${l.headsign?` dirección <em>${esc(l.headsign)}</em>`:''}${!legs[i-1]||legs[i-1].mode==='WALK'?'':` en <b>${esc(l.from||'')}</b>`}.<span class="det">${l.from&&(!legs[i-1]||legs[i-1].mode==='WALK')?esc(l.from)+' · ':''}sale ${hhmm(l.dep)}${l.track?' · vía '+esc(l.track):''}${l.stops?' · '+l.stops+' paradas':''}</span></li>`);
  steps.push(`<li style="--c:${c}">Bájate en <em>${esc(l.to||'')}</em>.</li>`)});
 steps.push(`<li class="end">Llegas a las ${hhmm(it.end)}.</li>`);
 $('#out').innerHTML=top(d)+`<div class="head">${it.min}<small>min</small></div>
 <p class="when${lv!=null&&lv<=1?' now':''}">${lv==null?'':lv<=1?'Sal ya':'Sal en '+lv+' min'} · llegas ${hhmm(it.end)}</p>
 ${croquis(it,R.O,d)}
 <ol class="steps">${steps.join('')}</ol>
 <div class="more">${R.its.length>1?`<button id="alt">Otra ruta · ${R.i+1}/${R.its.length}</button>`:''}<button id="new">Otro destino</button></div>`;
 $('#bk').onclick=back;$('#new').onclick=back;if($('#alt'))$('#alt').onclick=()=>{R.i=(R.i+1)%R.its.length;paint();$('#go').scrollTop=0}}
function back(){clearInterval(tick);R=null;screen('ask');q.value='';idle();setTimeout(()=>q.focus(),50)}

/* permisos */
let PERM=null;try{PERM=localStorage.getItem('parada-perm')}catch(e){}
const setPerm=v=>{PERM=v;try{localStorage.setItem('parada-perm',v)}catch(e){}};
function show1(id){['perm','ask','go'].forEach(x=>$('#'+x).classList.toggle('off',x!==id))}
$('#allow').onclick=async()=>{gps();try{if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop())}}catch(e){}setPerm('ok');show1('ask');setTimeout(()=>q.focus(),100)};
$('#skip').onclick=()=>{setPerm('skip');show1('ask');gpsMsg='no';paintWhere()};
/* voz: dime a dónde vas */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,voice=false;const mic=$('#mic');
if(!SR)mic.hidden=true;
mic.onclick=()=>{if(rec){try{rec.stop()}catch(e){}return}rec=new SR();rec.lang='es-ES';rec.interimResults=true;rec.continuous=false;

 rec.onresult=e=>{q.value=[...e.results].map(r=>r[0].transcript).join(' ').replace(/^(quiero ir |ir |llévame |llevame |vamos )?(a |al |hasta )/i,'')};
 rec.onerror=e=>{if(e.error==='not-allowed'){q.placeholder='Activa el micrófono en Ajustes › Safari';}};
 rec.onend=()=>{mic.classList.remove('on');mic.setAttribute('aria-label','Decir a dónde vas');rec=null;q.placeholder='¿A dónde vas?';if(q.value.trim()){voice=true;q.dispatchEvent(new Event('input'))}};
 try{rec.start()}catch(e){rec=null}};

/* arranque */
idle();if(PERM){show1('ask');if(PERM==='ok')gps();else{gpsMsg='no'}paintWhere()}else show1('perm');
}
